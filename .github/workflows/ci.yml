name: Go CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout=90s ./...
      - run: go vet ./...
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
